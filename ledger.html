<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3d6147">
<title>我的账本</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg1:#eef4ea; --bg2:#f6f2e7;
    --forest:#2f4a39; --forest2:#3d6147;
    --leaf:#5a8c5f; --leaf-d:#3f6b46; --sage:#e7f0e4; --sage2:#d4e6d2;
    --ink:#2b3a2e; --sub:#768a73;
    --card:#ffffff; --line:#e6ece2;
    --up:#d9534f; --down:#2e9e57;
    --shadow:0 8px 24px rgba(47,74,57,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);line-height:1.5;overflow-x:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 6px}
  .top .ttl{font-size:21px;font-weight:800;color:var(--forest)}
  .top .date{font-size:12px;color:var(--sub);margin-top:2px}
  .card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(230,236,226,.7)}
  .card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--forest)}
  .card h3 .hic{color:var(--leaf)}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{background:var(--sage);border-radius:16px;padding:14px}
  .stat .n{font-size:23px;font-weight:800;color:var(--ink)}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  .row{display:flex;gap:8px;align-items:center}
  input,select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fbfdf9;color:var(--ink);width:100%}
  input:focus,select:focus{outline:none;border-color:var(--leaf);background:#fff}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:15px}
  .btn{background:var(--leaf);color:#fff;padding:11px 16px;font-weight:700;white-space:nowrap}
  .btn:active{background:var(--leaf-d)}
  .btn.ghost{background:var(--sage);color:var(--leaf-d)}
  .btn.sm{padding:8px 12px;font-size:13px}
  .seg{display:flex;background:var(--sage);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
  .seg button{flex:1;background:none;color:var(--leaf-d);padding:8px 4px;font-weight:700;font-size:13px;min-width:52px}
  .seg button.on{background:#fff;color:var(--leaf-d);box-shadow:var(--shadow)}
  .seg.sm{padding:3px}
  .seg.sm button{padding:6px 14px;font-size:13px}
  .tip{font-size:12px;color:var(--sub);margin-top:8px}
  .up{color:var(--up)} .down{color:var(--down)}
  /* 账单条目 */
  .bill{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .bill:last-child{border-bottom:none}
  .bill .cat{width:38px;height:38px;border-radius:11px;background:var(--sage);color:var(--leaf-d);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
  .bill .mid{flex:1;min-width:0}
  .bill .mid .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bill .mid .s{font-size:12px;color:var(--sub);margin-top:1px}
  .bill .amt{font-size:16px;font-weight:800;white-space:nowrap}
  .bill .del{background:none;color:var(--sub);font-size:17px;padding:4px 6px}
  .bill .edit{background:none;color:var(--leaf);font-size:15px;padding:4px 6px;flex:none}
  .filters{display:flex;gap:8px;margin:4px 0 10px}
  .filters button{flex:1;background:#fff;color:var(--sub);padding:8px;border:1px solid var(--line)}
  .filters button.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
  .empty{text-align:center;color:var(--sub);padding:26px 0;font-size:14px}
  /* 分类支出条 */
  .cbar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .cbar .nm{width:64px;color:var(--sub)}
  .cbar .track{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
  .cbar .track > i{display:block;height:100%;background:var(--leaf);border-radius:99px}
  .cbar .vl{width:60px;text-align:right;font-weight:700;color:var(--ink)}
  /* 统计展开 */
  .statrow{cursor:pointer}
  .statrow .bill{margin:0;padding:13px 2px}
  .statrow .caret{color:var(--sub);font-size:12px;margin-left:4px;transition:transform .2s;display:inline-block}
  .statrow.open .caret{transform:rotate(90deg)}
  .statdetail{padding:4px 6px 8px;background:var(--sage);border-radius:0 0 12px 12px;margin-top:-2px}
  .statdetail .bill{border-bottom:1px dashed var(--line);padding:11px 2px}
  .statdetail .bill:last-child{border-bottom:none}
  .statdetail .tip{padding:8px 2px}
  /* 照片 / 编辑 / 灯箱 */
  .photoUp{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .photoBtn{display:inline-flex;align-items:center;gap:6px;background:var(--sage2);color:var(--leaf-d);padding:9px 12px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer}
  .photoPrev{width:46px;height:46px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer;flex:none}
  .bill .ph{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line);cursor:pointer}
  .phZoom{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:80;padding:20px}
  .phZoom img{max-width:92%;max-height:78%;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .phZoom .tip{color:#fff}
  /* 迷你走势 */
  .chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
  .bar{flex:1;background:var(--sage2);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;justify-content:center;position:relative;transition:height .4s}
  .bar > span{position:absolute;top:-15px;font-size:9px;color:var(--sub)}
  .barlabel{display:flex;gap:8px;margin-top:6px}
  .barlabel div{flex:1;text-align:center;font-size:10px;color:var(--sub)}
</style>
</head>
<body>
<div class="phZoom" id="phZoom"><img id="phZoomImg" alt="凭证大图"><div class="tip">点击任意处关闭</div></div>
<div class="wrap">
  <div class="top">
    <div>
      <div class="ttl">我的账本</div>
      <div class="date" id="today"></div>
    </div>
    <div class="seg sm" style="width:auto" id="quickType">
      <button data-t="out" class="on">支出</button>
      <button data-t="in">收入</button>
    </div>
  </div>

  <!-- 快速记一笔 -->
  <div class="card">
    <h3><span class="hic">⚡</span>快速记一笔</h3>
    <div class="row">
      <input type="text" id="quickAmt" inputmode="decimal" placeholder="金额，如 88">
      <button class="btn" id="quickAdd">记一笔</button>
    </div>
    <div class="tip" id="quickTip">数据仅存于本机（或已安装的本应用）。</div>
  </div>

  <!-- 录入 -->
  <div class="card">
    <h3><span class="hic">✍️</span>记一笔</h3>
    <div class="seg" id="typeSeg" style="margin-bottom:12px">
      <button data-t="out" class="on">支出</button>
      <button data-t="in">收入</button>
    </div>
    <div class="row" style="margin-bottom:8px"><input type="text" id="bAmt" inputmode="decimal" placeholder="金额"></div>
    <div class="row" style="margin-bottom:8px;gap:8px">
      <select id="bCat" style="flex:1"></select>
      <input type="date" id="bDate" style="flex:1">
    </div>
    <input type="text" id="bMemo" placeholder="备注（可选）" style="margin-bottom:10px">
    <div class="photoUp">
      <label class="photoBtn">📷 上传凭证照片<input type="file" id="bPhoto" accept="image/*" hidden></label>
      <img class="photoPrev" id="bPhotoPrev" alt="凭证预览" style="display:none">
    </div>
    <button class="btn" id="addBill" style="width:100%">添加记录</button>
    <button class="btn ghost" id="cancelEdit" style="width:100%;margin-top:8px;display:none">取消编辑</button>
  </div>

  <!-- 汇总 -->
  <div class="card">
    <h3><span class="hic">🧮</span>汇总 <span id="sumLabel" style="font-size:13px;color:var(--sub);font-weight:600"></span></h3>
    <div class="seg sm" id="sumSeg" style="margin-bottom:12px">
      <button data-p="month">本月</button>
      <button data-p="year" class="on">本年</button>
    </div>
    <div class="grid4">
      <div class="stat"><div class="n up" id="m-in">0</div><div class="l">收入</div></div>
      <div class="stat"><div class="n" id="m-out">0</div><div class="l">支出</div></div>
      <div class="stat" style="grid-column:span 2"><div class="n" id="m-net">0</div><div class="l">结余（收入−支出）</div></div>
    </div>
    <div id="catBars" style="margin-top:12px"></div>
    <h3 style="margin-top:16px"><span class="hic">📈</span>近 6 个月结余</h3>
    <div class="chart" id="trend"></div>
    <div class="barlabel" id="trendLabel"></div>
  </div>

  <!-- 明细与统计 -->
  <div class="card">
    <h3><span class="hic">📒</span>明细与统计</h3>
    <div class="seg" id="statSeg" style="margin-bottom:10px">
      <button data-g="month" class="on">按月</button>
      <button data-g="year">按年</button>
    </div>
    <div class="filters">
      <button data-f="all" class="on">全部</button>
      <button data-f="in">收入</button>
      <button data-f="out">支出</button>
    </div>
    <div id="statList"></div>
  </div>

  <!-- 导出 CSV -->
  <div class="card">
    <h3><span class="hic">📤</span>导出 Excel（CSV）</h3>
    <div class="row" style="margin-bottom:8px;gap:8px">
      <input type="date" id="expStart" style="flex:1">
      <span style="color:var(--sub);font-size:13px">至</span>
      <input type="date" id="expEnd" style="flex:1">
    </div>
    <div class="filters" id="expPresets" style="margin-bottom:10px">
      <button data-p="month">本月</button>
      <button data-p="year">本年</button>
      <button data-p="all">全部</button>
    </div>
    <button class="btn" id="expBtn" style="width:100%">导出选中时间范围的账单</button>
    <div class="tip">生成 .csv 文件，Excel 可直接打开，含日期 / 类型 / 分类 / 金额 / 备注，中文正常显示。</div>
  </div>

  <!-- 备份 -->
  <div class="card">
    <h3><span class="hic">💾</span>数据备份（防丢失）</h3>
    <div class="row" style="gap:8px">
      <button class="btn ghost sm" id="backupBtn" style="flex:1">导出全部备份</button>
      <label class="btn ghost sm" style="flex:1;text-align:center">导入备份<input type="file" id="backupFile" accept="application/json,.json" hidden></label>
    </div>
    <div class="tip">把全部账单打包成 .json 存到手机/电脑。换设备、清缓存或重装前先导出；需要时用「导入备份」即可完整恢复。这是防止数据丢失的最可靠手段。</div>
  </div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('本地存储已满，无法保存（可能是照片太多）。建议导出备份后清理部分记录。')}}};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todate(){return new Date().toISOString().slice(0,10)}
function ym(d){return (d||'').slice(0,7)}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('zh-CN')}
function monKeyShift(i){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function sumMonth(type,key){return bills.filter(b=>b.type===type&&ym(b.date)===key).reduce((a,b)=>a+Number(b.amount||0),0)}

/* 状态 */
const CATS=['餐饮','交通','购物','居住','工资','医疗','娱乐','其他'];
let bills=LS.get('wb_bills',[]);
let billType='out', billFilter='all', sumPeriod='year', statGroup='month';
let editId=null, pendingPhoto=null;

/* 顶部日期 */
const now=new Date(),h=now.getHours();
$('#today').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

/* 图片压缩 */
function compressImage(file,maxW,quality){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);const w=Math.round(img.width*scale),g=Math.round(img.height*scale);
      const c=document.createElement('canvas');c.width=w;c.height=g;c.getContext('2d').drawImage(img,0,0,w,g);
      resolve(c.toDataURL('image/jpeg',quality));
    };img.onerror=reject;img.src=r.result;};
    r.onerror=reject;r.readAsDataURL(file);
  });
}

function fillCats(){const s=$('#bCat');s.innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');s.value=billType==='in'?'工资':'餐饮'}

function billRowHTML(b){
  const sign=b.type==='in'?'+':'−';const col=b.type==='in'?'up':'';
  const ph=b.photo?`<img class="ph" src="${b.photo}" data-zoom="${b.photo}" alt="凭证">`:'';
  return `<div class="bill" data-id="${b.id}">
    ${ph}
    <div class="cat">${esc(b.cat.slice(0,2))}</div>
    <div class="mid"><div class="t">${esc(b.memo||b.cat)}</div>
      <div class="s">${b.date} · ${esc(b.cat)}</div></div>
    <div class="amt ${col}">${sign}${fmt(Number(b.amount))}</div>
    <button class="edit" data-edit="${b.id}" title="编辑">✎</button>
    <button class="del" data-del="${b.id}">✕</button></div>`;
}

function renderSummary(){
  const isY=sumPeriod==='year';const key=isY?todate().slice(0,4):ym(todate());
  let tIn=0,tOut=0;
  bills.forEach(b=>{const k=isY?b.date.slice(0,4):ym(b.date);if(k===key){if(b.type==='in')tIn+=Number(b.amount||0);else tOut+=Number(b.amount||0);}});
  $('#m-in').textContent='+'+fmt(tIn);
  $('#m-out').textContent='-'+fmt(tOut);
  $('#m-net').textContent=fmt(tIn-tOut);
  $('#m-net').className='n '+(tIn-tOut>=0?'up':'');
  $('#sumLabel').textContent=isY?(key+' 年'):(key.replace('-','年')+'月');
  const byCat={};bills.filter(b=>b.type==='out'&&(isY?b.date.slice(0,4)===key:ym(b.date)===key)).forEach(b=>byCat[b.cat]=(byCat[b.cat]||0)+Number(b.amount||0));
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const tot=entries.reduce((a,e)=>a+e[1],0)||1;
  $('#catBars').innerHTML=entries.length?entries.map(([k,v])=>`<div class="cbar"><div class="nm">${k}</div><div class="track"><i style="width:${v/tot*100}%"></i></div><div class="vl">${fmt(v)}</div></div>`).join('')
    :`<div class="tip">${isY?'本年':'本月'}暂无支出记录</div>`;
}

function renderTrend(){
  const keys=[];for(let i=5;i>=0;i--)keys.push(monKeyShift(i));
  const nets=keys.map(k=>fmt(sumMonth('in',k)-sumMonth('out',k)));
  const max=Math.max(1,...nets.map(Math.abs));
  $('#trend').innerHTML=keys.map((k,i)=>{
    const v=nets[i];const hh=Math.max(6,Math.abs(v)/max*108);
    const col=v>=0?'var(--up)':'var(--down)';
    return `<div class="bar" style="height:${hh}px;background:${col}33"><span style="color:${col}">${v}</span></div>`}).join('');
  $('#trendLabel').innerHTML=keys.map(k=>`<div>${k.slice(5)}月</div>`).join('');
}

function renderStats(){
  const box=$('#statList');
  const groups={};
  bills.forEach(b=>{const k=statGroup==='month'?ym(b.date):b.date.slice(0,4);groups[k]=groups[k]||{in:0,out:0};groups[k][b.type]+=Number(b.amount||0);});
  const t=todate();
  if(statGroup==='month'&&!groups[ym(t)])groups[ym(t)]={in:0,out:0};
  if(statGroup==='year'&&!groups[t.slice(0,4)])groups[t.slice(0,4)]={in:0,out:0};
  let keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  if(!keys.length){box.innerHTML='<div class="empty">还没有记录</div>';return;}
  box.innerHTML=keys.slice(0,30).map(k=>{
    const g=groups[k];const net=g.in-g.out;
    const label=statGroup==='month'?k.replace('-','年')+'月':k+'年';
    const tag=statGroup==='month'?k.slice(5)+'月':k+'年';
    return `<div class="statrow" data-key="${k}"><div class="bill">
      <div class="cat" style="background:var(--sage2);color:var(--leaf-d)">${tag}</div>
      <div class="mid"><div class="t">${label}</div>
        <div class="s">收入 ${fmt(g.in)} · 支出 ${fmt(g.out)}</div></div>
      <div class="amt ${net>=0?'up':'down'}">${net>=0?'+':''}${fmt(net)}</div>
      <span class="caret">▶</span></div>
      <div class="statdetail" data-key="${k}" style="display:none"></div></div>`;
  }).join('');
}

function renderAll(){renderSummary();renderTrend();renderStats();}

function editBill(id){
  const b=bills.find(x=>x.id===id);if(!b)return;
  editId=id;billType=b.type;
  [...$('#typeSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.t===billType));fillCats();
  $('#bAmt').value=b.amount;$('#bCat').value=b.cat;$('#bMemo').value=b.memo||'';$('#bDate').value=b.date;
  pendingPhoto=b.photo||null;
  if(pendingPhoto){$('#bPhotoPrev').src=pendingPhoto;$('#bPhotoPrev').style.display='block';}else{$('#bPhotoPrev').style.display='none';}
  $('#addBill').textContent='保存修改';$('#cancelEdit').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function cancelEdit(){
  editId=null;pendingPhoto=null;$('#bAmt').value='';$('#bMemo').value='';$('#bPhoto').value='';
  $('#bPhotoPrev').style.display='none';$('#bPhotoPrev').src='';
  $('#addBill').textContent='添加记录';$('#cancelEdit').style.display='none';
}
function addBill(){
  const amt=parseFloat($('#bAmt').value);
  if(!amt||amt<=0){$('#bAmt').focus();return;}
  if(editId){
    const b=bills.find(x=>x.id===editId);
    if(b){b.type=billType;b.amount=amt;b.cat=$('#bCat').value;b.memo=$('#bMemo').value.trim();b.date=$('#bDate').value||todate();b.photo=pendingPhoto||null;}
    editId=null;$('#addBill').textContent='添加记录';$('#cancelEdit').style.display='none';
  }else{
    bills.unshift({id:uid(),type:billType,amount:amt,cat:$('#bCat').value,memo:$('#bMemo').value.trim(),date:$('#bDate').value||todate(),photo:pendingPhoto||null});
  }
  LS.set('wb_bills',bills);
  $('#bAmt').value='';$('#bMemo').value='';$('#bPhoto').value='';pendingPhoto=null;$('#bPhotoPrev').style.display='none';$('#bPhotoPrev').src='';
  renderAll();
}

/* 事件 */
$('#quickType').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;billType=b.dataset.t;[...$('#quickType').children].forEach(x=>x.classList.toggle('on',x===b));});
$('#typeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;billType=b.dataset.t;[...$('#typeSeg').children].forEach(x=>x.classList.toggle('on',x===b));fillCats();});
$('#addBill').onclick=addBill;
$('#cancelEdit').onclick=cancelEdit;
$('#bPhoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;compressImage(f,800,0.72).then(d=>{pendingPhoto=d;$('#bPhotoPrev').src=d;$('#bPhotoPrev').style.display='block';}).catch(()=>alert('图片读取失败'));});
$('#bPhotoPrev').onclick=()=>{pendingPhoto=null;$('#bPhotoPrev').style.display='none';$('#bPhotoPrev').src='';$('#bPhoto').value='';};
$('#statList').addEventListener('click',e=>{
  const zoom=e.target.closest('[data-zoom]');if(zoom){$('#phZoomImg').src=zoom.dataset.zoom;$('#phZoom').style.display='flex';return;}
  const editBtn=e.target.closest('[data-edit]');if(editBtn){editBill(editBtn.dataset.edit);return;}
  const delBtn=e.target.closest('[data-del]');if(delBtn){const id=delBtn.dataset.del;if(confirm('确定删除这条记录？')){bills=bills.filter(b=>b.id!==id);LS.set('wb_bills',bills);renderAll();}return;}
  const row=e.target.closest('.statrow');if(!row)return;
  const k=row.dataset.key;const det=row.querySelector('.statdetail');
  if(det.style.display==='none'){
    let arr=bills.filter(b=>(statGroup==='month'?ym(b.date):b.date.slice(0,4))===k);
    if(billFilter!=='all')arr=arr.filter(b=>b.type===billFilter);
    det.innerHTML=arr.length?arr.sort((a,b)=>b.date.localeCompare(a.date)).map(billRowHTML).join(''):'<div class="tip">该筛选条件下无记录</div>';
    det.style.display='block';row.classList.add('open');
  }else{det.style.display='none';row.classList.remove('open');}
});
$('#statSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;statGroup=b.dataset.g;[...$('#statSeg').children].forEach(x=>x.classList.toggle('on',x===b));renderStats();});
$('#sumSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sumPeriod=b.dataset.p;[...$('#sumSeg').children].forEach(x=>x.classList.toggle('on',x===b));renderSummary();renderTrend();});
$('.filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;billFilter=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));renderStats();});
$('#phZoom').addEventListener('click',()=>{$('#phZoom').style.display='none';});
$('#quickAdd').onclick=()=>{
  const amt=parseFloat($('#quickAmt').value);
  if(!amt||amt<=0){$('#quickAmt').focus();return;}
  bills.unshift({id:uid(),type:billType,amount:amt,cat:'其他',memo:'',date:todate()});
  LS.set('wb_bills',bills);$('#quickAmt').value='';renderAll();
};

/* 导出 CSV */
function setRange(p){
  const t=todate();let s,e;
  if(p==='month'){s=ym(t)+'-01';e=t;}
  else if(p==='year'){s=t.slice(0,4)+'-01-01';e=t;}
  else{const ds=bills.map(b=>b.date).sort();s=ds[0]||t;e=ds[ds.length-1]||t;}
  $('#expStart').value=s;$('#expEnd').value=e;
}
function csvCell(v){v=String(v==null?'':v);if(/[",\r\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}
document.querySelectorAll('#expPresets button').forEach(b=>b.onclick=()=>setRange(b.dataset.p));
$('#expBtn').onclick=()=>{
  const s=$('#expStart').value,e=$('#expEnd').value;
  if(!s||!e){alert('请选择导出时间范围');return;}
  const rows=bills.filter(b=>b.date>=s&&b.date<=e).sort((a,b)=>b.date.localeCompare(a.date));
  if(!rows.length){alert('该时间范围内没有记录');return;}
  const head=['日期','类型','分类','金额','备注'];
  const lines=[head.join(',')].concat(rows.map(b=>[b.date,b.type==='in'?'收入':'支出',b.cat,Number(b.amount),b.memo||''].map(csvCell).join(',')));
  const csv='\uFEFF'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`账单_${s}_${e}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
};

/* 备份 / 恢复 */
$('#backupBtn').onclick=()=>{
  const data={wb_bills:bills};data._backupAt=new Date().toISOString();
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='账本备份_'+todate()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
};
$('#backupFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      let arr=null;
      if(Array.isArray(data))arr=data;
      else if(data&&data.wb_bills)arr=data.wb_bills;
      else if(data&&Array.isArray(data.bills))arr=data.bills;
      if(!Array.isArray(arr))throw new Error('找不到账单数据');
      bills=arr.map(b=>({id:b.id||uid(),type:b.type==='in'?'in':'out',amount:Number(b.amount)||0,cat:b.cat||'其他',memo:b.memo||'',date:b.date||todate(),photo:b.photo||null}));
      LS.set('wb_bills',bills);renderAll();
      alert('备份已导入，共 '+bills.length+' 条记录已恢复 ✅');
    }catch(err){alert('导入失败：文件不是有效备份（'+err.message+'）');}
    finally{e.target.value='';}
  };
  r.readAsText(f);
};

/* 初始化 */
$('#bDate').value=todate();
fillCats();setRange('year');renderAll();

/* PWA：托管时注册离线缓存（本地打开 file:// 时静默失败，不影响使用） */
try{
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}catch(e){}
</script>
